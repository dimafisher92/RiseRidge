name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Content lint (posts changed in this PR, strict for new/refreshed posts)
        if: github.event_name == 'pull_request'
        run: node scripts/seo/content-lint.mjs --changed origin/${{ github.base_ref }}

      - name: Content lint (all posts, basic checks)
        run: node scripts/seo/content-lint.mjs --all

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

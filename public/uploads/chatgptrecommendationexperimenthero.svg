<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A five by three grid of test runs showing repeated results, resting on a single shared source bar">
  <rect width="1200" height="630" fill="#FBFAF7"/>
  <rect x="0" y="0" width="1200" height="8" fill="#A9874E"/>

  <rect x="56" y="54" width="64" height="64" rx="8" fill="none" stroke="rgba(21,20,15,0.15)" stroke-width="2"/>
  <text x="70" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#1E3A2E">R<tspan fill="#A9874E" dx="-11">R</tspan></text>

  <g>
    <rect x="240" y="170" width="120" height="72" rx="10" fill="#1E3A2E"/>
    <rect x="390" y="170" width="120" height="72" rx="10" fill="#1E3A2E"/>
    <rect x="540" y="170" width="120" height="72" rx="10" fill="#1E3A2E"/>
    <rect x="690" y="170" width="120" height="72" rx="10" fill="#1E3A2E"/>
    <rect x="840" y="170" width="120" height="72" rx="10" fill="#1E3A2E"/>
  </g>

  <g>
    <rect x="240" y="264" width="120" height="72" rx="10" fill="#1E3A2E"/>
    <rect x="390" y="264" width="120" height="72" rx="10" fill="#1E3A2E"/>
    <rect x="540" y="264" width="120" height="72" rx="10" fill="#1E3A2E"/>
    <rect x="690" y="264" width="120" height="72" rx="10" fill="#1E3A2E"/>
    <rect x="840" y="264" width="120" height="72" rx="10" fill="#1E3A2E"/>
  </g>

  <g fill="#F4F0E8" stroke="#cfe0d4" stroke-width="2">
    <rect x="240" y="358" width="120" height="72" rx="10"/>
    <rect x="390" y="358" width="120" height="72" rx="10"/>
    <rect x="540" y="358" width="120" height="72" rx="10"/>
    <rect x="690" y="358" width="120" height="72" rx="10"/>
    <rect x="840" y="358" width="120" height="72" rx="10"/>
  </g>

  <g stroke="#cfe0d4" stroke-width="2">
    <line x1="300" y1="430" x2="300" y2="486"/>
    <line x1="450" y1="430" x2="450" y2="486"/>
    <line x1="600" y1="430" x2="600" y2="486"/>
    <line x1="750" y1="430" x2="750" y2="486"/>
    <line x1="900" y1="430" x2="900" y2="486"/>
  </g>

  <rect x="240" y="486" width="720" height="14" rx="7" fill="#A9874E"/>

  <g fill="#F4F0E8" stroke="#A9874E" stroke-width="3">
    <circle cx="300" cy="544" r="20"/>
    <circle cx="450" cy="544" r="20"/>
    <circle cx="600" cy="544" r="20"/>
    <circle cx="750" cy="544" r="20"/>
    <circle cx="900" cy="544" r="20"/>
  </g>
</svg>
